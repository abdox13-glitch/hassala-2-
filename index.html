<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الحصالة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#0d0a1f;--card:rgba(255,255,255,.055);--bd:rgba(140,110,255,.32);--tx:#f3f0ff;--mu:#a79fd0;--pu:#8b5cf6;--gr:#22c55e;--rd:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100%;background:radial-gradient(circle at 12% 0,#2b1a6e 0,transparent 42%),radial-gradient(circle at 100% 38%,#2a1160 0,transparent 38%),radial-gradient(circle at 0 80%,#1f1050 0,transparent 40%),var(--bg);color:var(--tx);font-family:'Cairo',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:10px 14px 140px}
button,input{font-family:inherit}
.hd{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:6px}
.hd .c{text-align:center}
.hd h1{margin:0;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.hd h1 img{width:40px;height:auto}
.hd p{margin:0;color:var(--mu);font-size:14px}
.hd p:before,.hd p:after{content:"✦";color:#fbbf24;margin:0 7px;font-size:16px}
.sq{width:48px;height:48px;border-radius:16px;background:var(--card);border:1px solid var(--bd);display:grid;place-items:center;font-size:24px;cursor:pointer;color:var(--tx);padding:0}
.av{position:relative;width:56px;height:56px;border-radius:50%;border:3px solid var(--pu);background:#2a1a6b;display:grid;place-items:center;font-size:26px;cursor:pointer;padding:0;box-shadow:0 0 14px rgba(139,92,246,.6)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.av:after{content:"";position:absolute;bottom:1px;right:1px;width:13px;height:13px;border-radius:50%;background:var(--gr);border:2px solid var(--bg)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:14px;margin-top:14px;backdrop-filter:blur(6px)}
.bal{display:flex;margin-top:78px;padding:12px 14px 16px;border-radius:44px 26px 26px 44px;background:linear-gradient(160deg,rgba(124,77,255,.12),rgba(255,255,255,.04))}
.bt{flex:1;min-width:0}
.pig{width:46%;flex:none;margin:-96px 0 -14px -22px;position:relative}
.pig img{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 16px rgba(0,0,0,.45))}
.pill{display:inline-flex;gap:6px;align-items:center;background:rgba(139,92,246,.22);border:1px solid var(--bd);border-radius:20px;padding:3px 12px;color:var(--mu);font-size:14px}
.big{font-size:40px;font-weight:800;line-height:1.1;margin:10px 0 0;direction:ltr;text-align:end;white-space:nowrap}
.big small{font-size:17px;color:var(--mu);font-weight:600}
.up{color:var(--gr);font-weight:700;direction:ltr;text-align:end;margin-top:2px;font-size:19px}
.dn{color:var(--rd)}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:22px;padding:9px 4px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 5px 0 rgba(0,0,0,.28),0 0 16px rgba(0,0,0,.25);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.btn i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:19px;line-height:1;font-weight:800}
.g{background:linear-gradient(#3ddc7c,#16a34a)}.g i{background:#0b2e1a}
.p{background:linear-gradient(#9b6dff,#6d3fe0)}.p i{background:rgba(255,255,255,.85);color:#6d3fe0}
.gl{display:flex;align-items:center;gap:8px;position:relative}
.gl .m{flex:1;min-width:0}
.gl .ti{width:104px;flex:none}
.gl .ti img{width:100%;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.goalname{font-size:19px;font-weight:700;white-space:normal;line-height:1.3}
.bar{direction:ltr;height:16px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:10px;transition:width .5s}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pct{font-size:28px;font-weight:800;color:#b18cff;direction:ltr}
.mu{color:var(--mu);font-size:14px}
.link{background:rgba(139,92,246,.18);border:1px solid var(--bd);color:var(--tx);border-radius:16px;padding:6px 14px;font-size:13px;cursor:pointer;margin-top:6px}
h2{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.t3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.t3 button{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:10px 2px 12px;color:var(--tx);font-size:14px;font-weight:700;cursor:pointer}
.t3 img{display:block;height:46px;margin:0 auto 6px}
.two{display:grid;grid-template-columns:1fr 1.1fr;gap:10px;margin-top:14px;align-items:stretch}
.two>.card:first-child{display:flex;flex-direction:column;justify-content:space-between}
.two .card{margin:0;padding:12px}
.cw{position:relative;margin:2px -4px 8px}
.cw img{width:100%;display:block}
.cw b{position:absolute;left:9%;top:76%;line-height:1;font-size:13px;font-weight:600;transform:rotate(-4deg);color:#e9e2ff;max-width:55%;overflow:hidden;white-space:nowrap}
.mg{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:9px;color:var(--tx);font-size:14px;font-weight:600;cursor:pointer}
.tx{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid rgba(255,255,255,.07)}
.tx.f{border-top:0}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:21px;font-weight:800;color:#fff;flex:none}
.tx .m{flex:1;min-width:0}
.tx .n{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .d{color:var(--mu);font-size:11px}
.amt{font-weight:700;direction:ltr;font-size:14px;white-space:nowrap}
.up2{color:var(--gr)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px}
.tile b{display:block;font-size:21px;direction:ltr;text-align:start;margin-top:4px}
.bn{position:relative;margin-top:14px;border-radius:26px;overflow:hidden;border:1px solid var(--bd);cursor:pointer}.bn img{width:100%;display:block}.tt{position:absolute;left:5%;top:0;bottom:0;width:56%;display:flex;flex-direction:column;justify-content:center;text-align:center;font-weight:800;font-size:clamp(13px,4.2vw,19px);line-height:1.5;transition:opacity .3s;text-shadow:0 2px 6px rgba(0,0,0,.55)}.tt em{font-style:normal;color:#fbbf24}.sg{font-size:13px;color:#e9e2ff;margin-top:4px;font-weight:600}
@font-face{font-family:'Cairo';src:url('Cairo.ttf');font-weight:200 1000;font-display:swap}
#dock{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:460px;display:flex;align-items:flex-end;gap:6px;pointer-events:none;z-index:5}
#dock img{width:84px;flex:none;margin-bottom:2px}
nav{flex:1;pointer-events:auto;display:flex;background:rgba(22,15,55,.94);border:1px solid var(--bd);border-radius:30px;padding:6px;backdrop-filter:blur(10px)}
nav button{flex:1;min-width:0;white-space:nowrap;background:none;border:0;color:#a78bfa;padding:6px 0;border-radius:24px;font-size:11.5px;cursor:pointer;font-weight:600}
nav svg{display:block;width:28px;height:28px;margin:0 auto 2px}
nav button.on{background:rgba(139,92,246,.32);color:#fff;box-shadow:0 0 0 1px var(--pu) inset}
#ov{position:fixed;inset:0;background:rgba(5,3,15,.7);display:none;align-items:flex-end;justify-content:center;z-index:9}
#ov.show{display:flex}
.sheet{width:100%;max-width:480px;background:#1a1240;border:1px solid var(--bd);border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font-size:20px}
.in,.inl{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--bd);border-radius:16px;padding:13px;color:var(--tx);font-size:20px;margin-bottom:10px;text-align:center}
.inl{font-size:18px}
.err{color:var(--rd);min-height:22px;font-size:14px}
.lg{display:flex;gap:8px}
.lg button{flex:1;padding:12px;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}
.lg button.on{background:#6d3fe0;border-color:var(--pu)}
.wide{width:100%;margin-top:10px;background:rgba(139,92,246,.2);border:1px solid var(--bd);color:var(--tx);border-radius:16px;padding:12px;font-size:16px;cursor:pointer}
.red{background:rgba(239,68,68,.18);border-color:var(--rd);color:#fecaca}

/* ===== Splash Screen ===== */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:#1a0a4a;overflow:hidden;transition:opacity .6s ease,visibility .6s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
#splash .progress-wrap{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:11%;width:68%;max-width:270px;text-align:center}
#splash .loading-text{color:rgba(255,255,255,.9);font-size:15px;font-weight:600;margin-bottom:14px;letter-spacing:.3px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
#splash .bar-bg{height:9px;background:rgba(255,255,255,.2);border-radius:20px;overflow:hidden;box-shadow:0 0 14px rgba(139,92,246,.4);border:1px solid rgba(255,255,255,.12)}
#splash .bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#8b5cf6,#a78bfa,#fbbf24,#f59e0b);border-radius:20px;transition:width .04s linear;box-shadow:0 0 12px rgba(251,191,36,.55)}
#splash .pct{color:#f3f0ff;font-size:13px;margin-top:9px;font-weight:700;direction:ltr;text-shadow:0 1px 4px rgba(0,0,0,.4)}
/* Cover the static bar drawn in the splash image */
#splash .cover-static{position:absolute;z-index:1;left:0;right:0;bottom:11%;height:7%;background:linear-gradient(to top, #1a0a4a 20%, transparent)}
#app,#dock,#ov{opacity:0;transition:opacity .4s ease}
#app.ready,#dock.ready,#ov.ready{opacity:1}

</style>
</head>

function f(n){return Number(n).toLocaleString("en-US",{maximumFractionDigits:2})}
function bal(){return S.tx.reduce(function(a,x){return a+(x.t=="in"?x.amt:-x.amt)},0)}
function mon(){var d=new Date(),m=0;S.tx.forEach(function(x){var e=new Date(x.ts);if(e.getMonth()==d.getMonth()&&e.getFullYear()==d.getFullYear())m+=x.t=="in"?x.amt:-x.amt});return m}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function day(ts){var d=new Date(ts),n=new Date(),y=new Date(n-864e5),hm=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
if(d.toDateString()==n.toDateString())return t("today")+" • "+hm;if(d.toDateString()==y.toDateString())return t("yday")+" • "+hm;return d.toLocaleDateString("en-GB")+" • "+hm}
function txs(n){var h="";if(!S.tx.length)return '<div class="mu">'+t("empty")+'</div>';
S.tx.slice(-n).reverse().forEach(function(x,k){var i=x.t=="in";h+='<div class="tx'+(k?"":" f")+'"><div class="ic" style="background:'+(i?"#22c55e":"#ef4444")+'">'+(i?"+":"−")+'</div><div class="m"><div class="n">'+esc(x.note||(i?t("tin"):t("tout")))+'</div><div class="d">'+day(x.ts)+'</div></div><div class="amt '+(i?"up2":"dn")+'">'+(i?"+":"-")+f(x.amt)+' '+cur()+'</div></div>'});return h}
function goalCard(){var g=S.goal,b=bal(),p=g.amt>0?Math.min(100,b/g.amt*100):0;
var h='<div class="card"><div class="gl"><div class="m">';
if(g.amt>0)h+='<div class="goalname">'+t("goal")+": "+esc(g.name||"—")+'</div><div class="bar"><i style="width:'+p+'%"></i></div><div class="row"><span class="mu">'+t("of")+' '+f(g.amt)+' '+cur()+'</span><span class="pct">'+Math.round(p)+'%</span></div><div class="mu">'+(p>=100?"🏆 "+t("done"):t("left")+': '+f(Math.max(0,g.amt-b))+' '+cur())+'</div>';
else h+='<div class="goalname">'+t("goal")+'</div><div class="mu">'+t("setgoal")+'</div>';
return h+'<button class="link" data-a="goal">'+(g.amt>0?t("editgoal"):t("setgoal"))+'</button></div><div class="ti"><img alt="" src="'+A.target+'"></div></div></div>'}
function bank(){return '<div class="cw"><img alt="" src="'+A.card+'">'+(S.name?'<b>'+esc(S.name)+'</b>':"")+'</div>'}
function head(){var av=S.img.avatar?'<img alt="" src="'+S.img.avatar+'">':"🧑";
return '<div class="hd"><button class="av" data-v="set" aria-label="'+t("prof")+'">'+av+'</button><div class="c"><h1>'+t("app")+'<img alt="" src="'+A.piggy+'"></h1><p>'+t("tag")+'</p></div><button class="sq" data-v="set" aria-label="'+t("set")+'">⚙️</button></div>'}
function home(){var b=bal(),m=mon(),h=head();
h+='<div class="card bal"><div class="bt"><span class="pill">👛 '+t("bal")+'</span><div class="big"><small>'+cur()+'</small> '+f(b)+'</div><div class="up'+(m<0?" dn":"")+'">'+f(Math.abs(m))+' '+cur()+(m<0?" −":" +")+' '+(m<0?"▼":"▲")+'</div><div class="btns"><button class="btn g" data-a="in"><i>+</i>'+t("add")+'</button><button class="btn p" data-a="out"><i>−</i>'+t("wd")+'</button></div></div><div class="pig"><img alt="" src="'+(S.img.piggy||A.piggy)+'"></div></div>';
h+=goalCard();
h+='<div class="two"><div class="card">'+bank()+'<button class="mg" data-v="cards">'+t("manage")+' 👛</button></div><div class="card"><h2><span>'+t("recent")+'</span><span>🕒</span></h2>'+txs(2)+'</div></div>';
h+=banner();return h}
var SL={ar:[["الأهداف الكبيرة","تبدأ بخطوة <em>صغيرة</em>"],["وفّر اليوم","وحقّق <em>حلمك</em> غدًا"],["كل دينار تدّخره","يقرّبك من <em>هدفك</em>"],["الصبر في التوفير","ثمرته <em>كبيرة</em>"]],fr:[["Les grands objectifs","commencent par un <em>petit</em> pas"],["Économise aujourd’hui","réalise ton <em>rêve</em> demain"],["Chaque dinar épargné","te rapproche de ton <em>but</em>"],["Épargner avec patience","rapporte <em>gros</em>"]],en:[["Big goals","start with a <em>small</em> step"],["Save today","achieve your <em>dream</em> tomorrow"],["Every dinar you save","brings you closer to your <em>goal</em>"],["Patience in saving","pays off <em>big</em>"]]};
var si=0;
function banner(){var s=SL[S.lang][si%4];return '<div class="bn" data-sl="1"><img alt="" src="'+A.banner+'"><div class="tt" id="tt"><div>'+s[0]+'</div><div>'+s[1]+'</div>'+(S.name?'<div class="sg">— '+esc(S.name)+' 🙂</div>':"")+'</div></div>'}
setInterval(function(){si++;var e=document.getElementById("tt");if(!e)return;var s=SL[S.lang][si%4];e.style.opacity=0;setTimeout(function(){e=document.getElementById("tt");if(!e)return;e.children[0].innerHTML=s[0];e.children[1].innerHTML=s[1];e.style.opacity=1},300)},6000);
function stats(){var tin=0,tout=0,mx=0;S.tx.forEach(function(x){if(x.t=="in"){tin+=x.amt;mx=Math.max(mx,x.amt)}else tout+=x.amt});
function tl(l,v){return '<div class="tile"><span class="mu">'+l+'</span><b>'+v+'</b></div>'}
return head()+'<div class="tiles">'+tl(t("total"),f(tin)+" "+cur())+tl(t("out"),f(tout)+" "+cur())+tl(t("max"),f(mx)+" "+cur())+tl(t("month"),f(mon())+" "+cur())+tl(t("bal"),f(bal())+" "+cur())+tl(t("cnt"),S.tx.length)+'</div>'}
function sett(){return head()+'<div class="card"><h2>'+t("prof")+'</h2><input class="inl" id="nm" maxlength="24" placeholder="'+t("name")+'" value="'+esc(S.name||"")+'"><button class="wide" data-a="pav">📷 '+t("pav")+'</button><button class="wide" data-a="ppig">🐷 '+t("ppig")+'</button><button class="wide" data-a="rmimg">'+t("rm")+'</button></div><div class="card"><h2>'+t("lang")+'</h2><div class="lg"><button data-l="ar" class="'+(S.lang=="ar"?"on":"")+'">العربية</button><button data-l="fr" class="'+(S.lang=="fr"?"on":"")+'">Français</button><button data-l="en" class="'+(S.lang=="en"?"on":"")+'">English</button></div><button class="wide red" data-a="reset">'+(armed?t("sure"):t("reset"))+'</button></div>'}
var IC={wallet:'<path d="M3 6.5A2.5 2.5 0 0 1 5.500 4H19v3H5.500a.5.5 0 0 0 0 1H20a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5.500A2.500 2.500 0 0 1 3 17.500zM16 12.500a1.500 1.500 0 1 0 0 3h5v-3z" fill="currentColor"/>',
home:'<path d="M12 3 2 12h3v9h5.500v-6h3v6H19v-9h3z" fill="currentColor"/>',
stats:'<rect x="3" y="13" width="4.500" height="8" rx="1.200" fill="currentColor"/><rect x="9.800" y="8" width="4.500" height="13" rx="1.200" fill="currentColor"/><rect x="16.500" y="3" width="4.500" height="18" rx="1.200" fill="currentColor"/>',
goals:'<path d="M7 3h10v4.500a5 5 0 0 1-4 4.900V15h3.500v2H7.500v-2H11v-2.600A5 5 0 0 1 7 7.500zM4 5h2v3H4.500A.5.5 0 0 1 4 7.500zm14 0h2v2.500a.5.5 0 0 1-.5.5H18zM8 18h8v3H8z" fill="currentColor"/>'};
function render(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=="ar"?"rtl":"ltr";document.title=t("app");
var v={home:home,stats:stats,set:sett,goals:function(){return head()+goalCard()},cards:function(){return head()+'<div class="card" style="padding:20px 24px 14px">'+bank()+'</div>'},wallet:function(){return head()+'<div class="card"><h2><span>'+t("wallet")+'</span><span>👛</span></h2><div class="big" style="text-align:start"><small>'+cur()+'</small> '+f(bal())+'</div></div><div class="card"><h2><span>'+t("recent")+'</span><span>🕒</span></h2>'+txs(40)+'</div>'}};
$("#app").innerHTML=(v[view]||home)();
var n=[["wallet",t("wallet")],["home",t("home")],["stats",t("stats")],["goals",t("goals")]];
$("#nav").innerHTML=n.map(function(x){return '<button data-v="'+x[0]+'" class="'+(view==x[0]?"on":"")+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+IC[x[0]]+'</svg>'+x[1]+'</button>'}).join("")}
function openSheet(a){var h='<h3>'+(a=="in"?"+ "+t("add"):a=="out"?"− "+t("wd"):"🎯 "+t("goal"))+'</h3>';
if(a=="goal")h+='<input class="in" id="i2" maxlength="40" placeholder="'+t("goalname")+'" value="'+esc(S.goal.name)+'">';
h+='<input class="in" id="i1" inputmode="decimal" placeholder="'+t("amount")+' ('+cur()+')">';
if(a!="goal")h+='<input class="in" id="i2" maxlength="30" placeholder="'+t("note")+'" style="font-size:16px">';
h+='<div class="err" id="er"></div><div class="btns" style="margin-top:4px"><button class="btn p" data-a="x">'+t("cancel")+'</button><button class="btn g" data-s="'+a+'">'+t("save")+'</button></div>';
$("#sh").innerHTML=h;$("#ov").className="show";setTimeout(function(){$("#i1").focus()},50)}
function submit(a){var v=parseFloat(($("#i1").value||"").replace(",","."));
if(!(v>0)){$("#er").textContent=t("bad");return}
if(a=="out"&&v>bal()+1e-9){$("#er").textContent=t("nb");return}
if(a=="goal")S.goal={name:$("#i2").value.trim(),amt:v};
else S.tx.push({t:a,amt:v,note:$("#i2").value.trim(),ts:Date.now()});
save();$("#ov").className="";render()}
function pick(key,max,png){var i=document.createElement("input");i.type="file";i.accept="image/*";
i.onchange=function(){var fl=i.files[0];if(!fl)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
c.getContext("2d").drawImage(im,0,0,c.width,c.height);var old=S.img[key];
S.img[key]=c.toDataURL(png?"image/png":"image/jpeg",.85);
if(!save()){S.img[key]=old;alert(t("big"))}render()};im.src=r.result};r.readAsDataURL(fl)};i.click()}
document.addEventListener("click",function(e){if(e.target.closest("[data-sl]")){si++;render();return}var b=e.target.closest("[data-a],[data-v],[data-l],[data-s]");if(!b)return;
var d=b.dataset;
if(d.v){view=d.v;armed=false;render();window.scrollTo(0,0);return}
if(d.l){S.lang=d.l;save();render();return}
if(d.s){submit(d.s);return}
if(d.a=="x"){$("#ov").className="";return}
if(d.a=="pav"){pick("avatar",300,false);return}
if(d.a=="ppig"){pick("piggy",600,true);return}
if(d.a=="rmimg"){S.img={};save();render();return}
if(d.a=="reset"){if(armed){S={lang:S.lang,name:S.name,img:S.img,goal:{name:"",amt:0},tx:[]};save();armed=false}else armed=true;render();return}
openSheet(d.a)});
document.addEventListener("input",function(e){if(e.target.id=="nm"){S.name=e.target.value;save()}});
$("#ov").addEventListener("click",function(e){if(e.target.id=="ov")$("#ov").className=""});

/* ===== Splash Progress ===== */
(function(){
  var bar = document.getElementById('splash-bar');
  var pct = document.getElementById('splash-pct');
  var splash = document.getElementById('splash');
  var p = 0;
  var timer = setInterval(function(){
    p += (p < 70 ? 2.2 : p < 90 ? 1.1 : 0.6);
    if(p >= 100){
      p = 100;
      clearInterval(timer);
      bar.style.width = '100%';
      pct.textContent = '100%';
      setTimeout(function(){
        splash.classList.add('hide');
        document.getElementById('app').classList.add('ready');
        document.getElementById('dock').classList.add('ready');
        var ov = document.getElementById('ov');
        if(ov) ov.classList.add('ready');
        setTimeout(function(){ splash.style.display = 'none'; }, 700);
      }, 350);
    } else {
      bar.style.width = p + '%';
      pct.textContent = Math.floor(p) + '%';
    }
  }, 40);
})();

render();;
</script>
</body>
</html>
